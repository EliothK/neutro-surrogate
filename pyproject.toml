[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutro-surrogate"
version = "0.1.0"
description = "Physics-informed neural surrogate for a 1D slab-reactor diffusion eigenproblem."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "optuna>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]